<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Under Wraps</title>
<meta name="description" content="Gift planning for families, kept under wraps.">
<meta name="theme-color" content="#f6e3b4"><meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Under Wraps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:light-dark(#ffffff,#150c0f);--surf:light-dark(#f7f1ee,#21141a);--line:light-dark(#eadfda,#3a252c);--ink:light-dark(#22161a,#f5eaec);--mut:light-dark(#6f5c62,#b9a3aa);--red:light-dark(#9b1b30,#6e1222);--redt:light-dark(#9b1b30,#ef7a8d);--btn:light-dark(#9b1b30,#c4334b);--gold:#e2ac3a;--hdr:light-dark(#f6e3b4,#2a1d12);--hdrink:light-dark(#5e0f1d,#f6e3b4);--tagc:light-dark(#9b1b30,#c4334b);--ok:light-dark(#2f6b5a,#6cc3a5)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,7vw,46px)}h2{font-size:24px}h3{font-size:16px;margin:22px 0 8px}
#app{padding-bottom:120px}
.top{position:relative;background:var(--hdr);color:var(--hdrink);min-height:176px;padding:calc(16px + env(safe-area-inset-top)) max(18px,calc((100% - 680px)/2)) 22px;overflow:hidden}
.hdrtag{position:absolute;right:max(8px,calc((100% - 720px)/2));top:calc(50px + env(safe-area-inset-top));width:clamp(100px,24vw,136px);transform:rotate(-9deg);transform-origin:30% 50%}
.top.welcome .hdrtag{top:calc(14px + env(safe-area-inset-top))}
.top>*:not(.hdrtag){position:relative;z-index:1}
.top h1,.top .sum,.top .lede{padding-right:clamp(96px,24vw,150px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.fam{background:color-mix(in srgb,var(--hdrink) 10%,transparent);border:0;color:var(--hdrink);border-radius:999px;min-height:42px;padding:0 14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:62%}
.fam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--hdrink) 10%,transparent);color:var(--hdrink);display:grid;place-items:center;cursor:pointer}
.sum{margin-top:8px}.sum b{font-size:22px;font-variant-numeric:tabular-nums}
.lede{max-width:30em;margin:10px 0 0}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--redt);border-radius:8px;transition:width .45s ease}
.meter.over i{background:#d2462f}
.top .meter{background:color-mix(in srgb,var(--hdrink) 15%,transparent);margin-top:10px;max-width:min(440px,calc(100% - 120px))}.top .meter i{background:var(--tagc)}
.tabs{position:sticky;top:0;z-index:4;display:flex;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:max(8px,calc((100% - 700px)/2))}
.tabs button{flex:1;min-height:50px;background:none;border:0;border-bottom:3px solid transparent;font-weight:600;color:var(--mut);cursor:pointer}
.tabs .on{color:var(--redt);border-color:var(--redt)}
.pad{padding:8px max(16px,calc((100% - 680px)/2)) 0}
.note{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:12px;padding:10px 14px;font-size:14px;margin:14px 0}
.tags{display:grid;gap:12px;margin-top:14px}
.tag{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:8px 18px 18px 8px;padding:14px 14px 14px 34px;cursor:pointer}
.tag::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.tag>div{flex:1}.tag h3{margin:0;font-size:18px}.tag p{margin:2px 0 8px;color:var(--mut);font-size:15px}
.tag.me{border-style:dashed}.tag.me p{margin-bottom:0}
.chev{font-size:28px;color:var(--mut);line-height:1}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:18px}
.list{display:grid;gap:8px;margin:14px 0}
.gift{display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:4px 8px 4px 2px}
.gmain{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:8px;cursor:pointer;min-height:48px}
.gt{flex:1;display:grid}.gt b{font-weight:600}.gt small{color:var(--mut);font-size:13px}
.price{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{border:0;border-radius:999px;padding:0 12px;min-height:40px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none}
.s-idea{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut)}
.s-bought{background:color-mix(in srgb,var(--redt) 15%,transparent);color:var(--redt)}
.s-wrapped{background:color-mix(in srgb,var(--gold) 28%,transparent);color:light-dark(#7a5208,#f3cf7a)}
.s-given{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--btn);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--redt);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.danger{background:transparent;color:light-dark(#b3261e,#ff8a80);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.wide{width:100%}.btn.sm{min-height:38px;padding:0 12px;font-size:14px}.btn:disabled{opacity:.6}
.link{background:none;border:0;padding:0;color:var(--redt);font-weight:600;cursor:pointer;text-decoration:underline;min-height:32px}
input,select,textarea{width:100%;min-height:44px;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{resize:vertical}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.money input{padding-left:26px}
.stackf{display:grid;gap:12px}.stackf label{display:grid;gap:4px;font-size:14px;font-weight:500;color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.row>input{flex:1 1 160px;width:auto}.row .money{flex:1 1 120px}
.row label{flex:1 1 100%;font-size:14px;color:var(--mut);font-weight:500}
.code{text-transform:uppercase;letter-spacing:.15em;font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.card h2{margin-bottom:8px}
.big{font-size:clamp(30px,8vw,40px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-bottom:10px}.big small{font-size:16px;color:var(--mut);font-weight:500}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.brow .meter{grid-column:1/-1}.bl{display:flex;gap:8px;align-items:center}.bv{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}.bv small{color:var(--mut);font-weight:500}
.muted,.none{color:var(--mut);font-size:14px}.none{padding:10px 2px}
.back{background:none;border:0;color:var(--redt);font-weight:600;min-height:44px;padding:0;cursor:pointer}
.phead{display:flex;align-items:center;gap:12px}.phead p{margin:2px 0 0;color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 10px}
.stats div{background:var(--surf);border-radius:12px;padding:10px 12px;display:grid}.stats span{font-size:13px;color:var(--mut)}.stats b{font-size:clamp(16px,4.6vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}
.search input{margin-top:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.claim .pick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.fab{position:fixed;right:max(16px,calc((100% - 720px)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom));min-height:54px;padding:0 22px;border-radius:999px;border:0;background:var(--btn);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 22px rgba(60,10,20,.3);cursor:pointer;z-index:5}
.sheet-wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,5,10,.55)}
.sheet{position:relative;width:min(100%,560px);max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;background:none;font-size:28px;cursor:pointer;color:var(--mut)}
.sheet h2{margin:0 44px 14px 0}.sheet .card{background:var(--bg)}
.acts{display:flex;gap:10px}.acts .btn:last-child{flex:1}
.codebox{display:flex;align-items:center;gap:12px;background:var(--surf);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.codebox span{font-size:28px;font-weight:700;letter-spacing:.14em;flex:1}
.steps{padding-left:20px;margin:10px 0}.steps li{margin:6px 0}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surf);border:0;width:100%;text-align:left;min-height:50px}
.pickf{cursor:pointer}.pickf.on{box-shadow:inset 0 0 0 2px var(--redt)}
.pn{flex:1;display:grid}.pn small{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
.undo{background:none;border:0;color:var(--gold);font-weight:700;min-height:36px;cursor:pointer}
.empty{min-height:70vh;display:grid;place-content:center;text-align:center;padding:24px;gap:10px;max-width:520px;margin:0 auto}
.spin{width:36px;height:36px;margin:0 auto;border-radius:50%;border:4px solid var(--line);border-top-color:var(--redt);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card .gift{background:var(--bg)}
.card h3:first-child{margin-top:0}
.wl{color:var(--redt);font-weight:600;text-decoration:none}
.gmain.ro{cursor:default}
.s-get{background:var(--btn);color:#fff}
/* ---------- Liquid glass (iPhone / iPad) ---------- */
.ios{--glass:light-dark(rgba(255,255,255,.58),rgba(42,24,30,.55));--glass-edge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.18));--glass-shadow:0 10px 34px light-dark(rgba(80,15,30,.18),rgba(0,0,0,.5))}
.ios .glass,.ios .tabs,.ios .sheet,.ios #toast{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px light-dark(rgba(255,255,255,.45),rgba(255,255,255,.08)),var(--glass-shadow)}
.ios #app{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.ios .tabs{position:fixed;top:auto;left:14px;right:84px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:440px;border:0;border-radius:999px;padding:5px;gap:2px;z-index:6}
.ios .tabs button{min-height:48px;border:0;border-radius:999px;font-size:14px;color:var(--ink);transition:background .2s}
.ios .tabs .on{color:var(--redt);background:light-dark(rgba(155,27,48,.12),rgba(239,122,141,.18))}
.ios .fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:58px;height:58px;min-height:0;padding:0;font-size:0;border-radius:50%;background:color-mix(in srgb,var(--btn) 84%,transparent);color:#fff;-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(60,0,10,.3),0 10px 28px rgba(80,15,30,.3)}
.ios .fab::before{content:"+";font-size:32px;line-height:1;font-weight:500}
.ios .fam,.ios .icon{background:light-dark(rgba(255,255,255,.45),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 light-dark(rgba(255,255,255,.95),rgba(255,255,255,.3)),inset 0 0 0 1px light-dark(rgba(255,255,255,.6),rgba(255,255,255,.1)),0 2px 8px rgba(94,15,29,.08)}
.ios .scrim{background:rgba(20,5,10,.28)}
.ios .sheet{border-radius:30px;margin:0 8px calc(8px + env(safe-area-inset-bottom));width:min(calc(100% - 16px),560px);padding-bottom:24px}
.ios .sheet .card,.ios .sheet input,.ios .sheet select,.ios .sheet textarea,.ios .sheet .codebox,.ios .sheet .prow{background:light-dark(rgba(255,255,255,.6),rgba(255,255,255,.06))}
.ios #toast{color:var(--ink);bottom:calc(86px + env(safe-area-inset-bottom))}
.ios .btn,.ios input,.ios select,.ios textarea{border-radius:14px}
.ios .tag,.ios .gift,.ios .card{box-shadow:inset 0 1px 0 light-dark(rgba(255,255,255,.9),rgba(255,255,255,.05))}
@media(max-width:380px){.two{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}.sheet{animation:none}.spin{animation-duration:3s}}
</style></head><body>
<div id="app"><div class="empty"><div class="spin"></div><p>Unwrapping your gift list…</p></div></div>
<div id="sheet" class="sheet-wrap" hidden><div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">×</button><div class="sheet-body"></div></div></div>
<div id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=Math.round((+n||0)*100)/100;return (v<0?'-$':'$')+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})};
const STAT=[['idea','Idea'],['bought','Bought'],['wrapped','Wrapped'],['given','Given']];
const statLabel=k=>(STAT.find(s=>s[0]===k)||STAT[0])[1];
const COLS=['#9b1b30','#b86e12','#2f6b5a','#3d5a9e','#7f4596','#b0473a','#1d7381'];
const col=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return COLS[Math.abs(h)%COLS.length]};
const TAG='<svg class="hdrtag" viewBox="0 0 180 180" aria-hidden="true"><path d="M56 100C40 72 30 52 18 30" fill="none" style="stroke:var(--tagc)" stroke-width="4" stroke-linecap="round"/><path d="M64 52H140A12 12 0 0 1 152 64V136A12 12 0 0 1 140 148H64L32 100Z" style="fill:var(--tagc)"/><circle cx="58" cy="100" r="8" style="fill:var(--hdr)"/><text x="109" y="92" text-anchor="middle" font-family="DM Serif Display,Georgia,serif" font-size="25" fill="#f6e3b4">Under</text><text x="109" y="128" text-anchor="middle" font-family="DM Serif Display,Georgia,serif" font-size="25" fill="#f6e3b4">Wraps</text><path d="M80 103H138" stroke="#e2ac3a" stroke-width="3" stroke-linecap="round"/></svg>';
const HEAD=(inner,welcome)=>`<header class="top${welcome?' welcome':''}">${TAG}${inner}</header>`;
const APP_VERSION='v6 (always light)';
const APP_LINK=location.origin+location.pathname.replace(/index\.html$/,'');

const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||/[?&]glass\b/.test(location.search);
if(IOS)document.documentElement.classList.add('ios');
const cfg=window.UNDER_WRAPS||{};
const configured=!!(cfg.SUPABASE_URL&&cfg.SUPABASE_KEY&&!/YOUR-PROJECT|PASTE_YOUR/.test(cfg.SUPABASE_URL+cfg.SUPABASE_KEY));
let sb=null,uid=null,chan=null,rt=null;
const S={loading:true,err:'',email:'',authMode:'in',families:[],famId:null,fam:null,famLoaded:false,people:[],gifts:[],wishes:[],myLimit:0,tab:'people',person:null,q:'',status:'all'};

const mine=()=>S.people.filter(p=>p.claimed_by===uid).map(p=>p.id);
const me=()=>S.people.find(p=>p.claimed_by===uid);
const pname=id=>(S.people.find(p=>p.id===id)||{}).name||'Someone';
const visible=()=>{const m=mine();return S.gifts.filter(g=>!m.includes(g.recipient))};
const spent=gs=>gs.filter(g=>g.status!=='idea').reduce((a,g)=>a+(+g.price||0),0);
const planned=gs=>gs.filter(g=>g.status==='idea').reduce((a,g)=>a+(+g.price||0),0);
const byDate=(a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''));
const meter=(s,b)=>b?`<div class="meter${s>b?' over':''}"><i style="width:${Math.min(100,s/b*100)}%"></i></div>`:'';
const avatar=p=>`<span class="avatar" style="--c:${col(p.id)}">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span>`;

// ---------- Supabase helpers ----------
const MSG={no_family:'No family found with that code.',taken:'Someone has already picked that name.',already_claimed:'You have already picked your name in this family.',no_person:'That name is no longer in the family.'};
function errMsg(e){
  const m=String(e&&e.message||'');
  for(const k in MSG)if(m.includes(k))return MSG[k];
  if(e&&e.code==='23505')return 'That’s already been taken.';
  if(e&&e.code==='23503')return 'Remove their gifts first.';
  if(e&&(e.code==='42501'||/row-level security|permission/i.test(m)))return 'You don’t have permission to change that.';
  if(/Invalid login/i.test(m))return 'Wrong email or password.';
  if(/already registered/i.test(m))return 'That email already has an account. Sign in instead.';
  if(/Password should be/i.test(m))return 'Password needs at least 6 characters.';
  if(/fetch|network/i.test(m))return 'Couldn’t reach the server. Check your connection.';
  return m||'Something went wrong. Try again.';
}
async function q(p,quiet){
  try{const {data,error}=await p;if(error)throw error;return {ok:true,data}}
  catch(err){if(!quiet)toast(errMsg(err));return {ok:false,err}}
}

// ---------- Views ----------
function render(){
  const app=$('#app'),act=document.activeElement&&document.activeElement.id;
  if(!configured){app.innerHTML=`${HEAD('<h1>Under Wraps</h1><p class="lede">Almost there.</p>',1)}<main class="pad"><section class="card"><h2>Connect your database</h2><p>Open <b>config.js</b> in your GitHub repository and paste in your Supabase project URL and publishable key, then commit the change. The app will load a minute or two later.</p></section></main>`;return}
  if(!sb){app.innerHTML=`<div class="empty"><h2>Can’t connect</h2><p>Check your internet connection and reopen the app.</p></div>`;return}
  if(S.loading){app.innerHTML=`<div class="empty"><div class="spin"></div><p>${esc(S.err||'Unwrapping your gift list…')}</p></div>`;return}
  if(!uid){app.innerHTML=authView();return}
  if(S.famId&&!S.famLoaded){app.innerHTML=`<div class="empty"><div class="spin"></div><p>Unwrapping your gift list…</p></div>`;return}
  if(!S.fam){
    app.innerHTML=`${HEAD('<h1>Under Wraps</h1><p class="lede">Gift planning for families, kept under wraps.</p>',1)}<main class="pad">${startForms()}<p class="muted">Signed in as ${esc(S.email)} · <button class="link" data-act="signout">Sign out</button></p></main>`;return}
  const m=me(),vis=visible(),others=S.people.filter(p=>p.claimed_by!==uid);
  const bud=others.reduce((a,p)=>a+(+p.budget||0),0),sp=spent(vis);

// ---------- Data loading & live sync ----------
async function loadFamilies(prefer){
  const r=await q(sb.from('families').select('id,name').order('created_at'),true);
  S.families=r.ok?r.data:[];
  const ids=S.families.map(f=>f.id);
  let pick=prefer;
  if(!ids.includes(pick)){try{pick=localStorage.getItem('uw-fam')}catch(_){}}
  if(!ids.includes(pick))pick=ids.includes(S.famId)?S.famId:(ids[0]||null);
  if(pick!==S.famId)await switchFam(pick);else render();
}

async function refresh(){
  const fid=S.famId;if(!fid)return;
  const [f,p,g,l,w]=await Promise.all([
    q(sb.from('families').select('*').eq('id',fid).maybeSingle(),true),
    q(sb.from('people').select('*').eq('family_id',fid).order('created_at'),true),
    q(sb.from('gifts').select('*').eq('family_id',fid),true),
    q(sb.from('limits').select('amount').eq('family_id',fid).maybeSingle(),true),
    q(sb.from('wishes').select('*').eq('family_id',fid).order('created_at'),true)]);
  if(fid!==S.famId)return;
  S.fam=f.ok?f.data:null;
  if(p.ok)S.people=p.data;
  if(g.ok)S.gifts=g.data;
  S.wishes=w.ok?w.data:[];
  S.myLimit=l.ok&&l.data?+l.data.amount:0;
  S.famLoaded=true;
  const nm=S.families.find(x=>x.id===fid);if(nm&&S.fam)nm.name=S.fam.name;
  render();
}
const soon=()=>{clearTimeout(rt);rt=setTimeout(refresh,250)};

async function switchFam(fid){
  if(chan){sb.removeChannel(chan);chan=null}
  Object.assign(S,{famId:fid,fam:null,people:[],gifts:[],wishes:[],myLimit:0,person:null,famLoaded:!fid});
  if(!fid){render();return}
  try{localStorage.setItem('uw-fam',fid)}catch(_){}
  render();
  const on=(c,table,event,filter)=>c.on('postgres_changes',filter?{event,schema:'public',table,filter}:{event,schema:'public',table},soon);
  let c=sb.channel('fam-'+fid);
  c=on(c,'families','UPDATE','id=eq.'+fid);
  for(const t of ['people','gifts','wishes']){c=on(c,t,'INSERT','family_id=eq.'+fid);c=on(c,t,'UPDATE','family_id=eq.'+fid);c=on(c,t,'DELETE')}
  chan=c.subscribe();
  await refresh();
}

// ---------- Actions ----------
async function createFamily(d){
  const name=(d.name||'').trim(),my=(d.me||'').trim();if(!name||!my)return;
  const r=await q(sb.rpc('create_family',{p_name:name,p_occasion:(d.occasion||'').trim(),p_me:my}));
  if(!r.ok)return;
  closeSheet();S.tab='people';await loadFamilies(r.data);toast('Family created');
}
async function join(raw){
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){toast('Codes are six letters and numbers.');return}
  const r=await q(sb.rpc('join_family',{p_code:code}));
  if(!r.ok)return;
  closeSheet();S.tab='people';await loadFamilies(r.data);
}
async function signOut(){
  closeSheet();
  if(chan){sb.removeChannel(chan);chan=null}
  await sb.auth.signOut();
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab'){S.tab=v;S.person=null;render();window.scrollTo(0,0)}
  else if(a==='person'){S.person=v;render();window.scrollTo(0,0)}
  else if(a==='back'){S.person=null;render()}
  else if(a==='filter'){S.status=v;render()}
  else if(a==='authmode'){S.authMode=S.authMode==='in'?'up':'in';render()}
  else if(a==='signout')signOut();
  else if(a==='newgift')openSheet(giftSheet(null,v));
  else if(a==='edit'){const g=S.gifts.find(x=>x.id===v);if(g)openSheet(giftSheet(g))}
  else if(a==='cycle'){const g=S.gifts.find(x=>x.id===v);if(!g)return;const i=STAT.findIndex(s=>s[0]===g.status);
    g.status=STAT[(i+1)%STAT.length][0];render();
    await q(sb.from('gifts').update({status:g.status,updated_at:new Date().toISOString()}).eq('id',v));soon()}
  else if(a==='newwish')openSheet(wishSheet(null,v));
  else if(a==='editwish'){const w=S.wishes.find(x=>x.id===v);if(w)openSheet(wishSheet(w))}
  else if(a==='getwish'){const w=S.wishes.find(x=>x.id===v);if(!w)return;const m=me();
    openSheet(giftSheet({title:w.title,recipient:w.person,buyer:m?m.id:'',price:+w.price?w.price:'',status:'bought',store:hostOf(safeLink(w.link)),notes:w.notes||'',wish_id:w.id}))}
  else if(a==='delwish'){const w=S.wishes.find(x=>x.id===v);if(!w)return;closeSheet();
    if((await q(sb.from('wishes').delete().eq('id',v))).ok){refresh();toast('Wish removed',async()=>{if((await q(sb.from('wishes').insert(w))).ok)refresh()})}}
  else if(a==='close')closeSheet();
  else if(a==='settings')openSheet(settingsSheet());
  else if(a==='fams')openSheet(famsSheet());
  else if(a==='switch'){closeSheet();if(v!==S.famId){S.tab='people';switchFam(v)}}
  else if(a==='copy'){try{await navigator.clipboard.writeText(v);toast('Copied')}catch(_){toast(v)}}
  else if(a==='claim'){if(me())return;if((await q(sb.rpc('claim_person',{p_person:v}))).ok)refresh()}
  else if(a==='delgift'){const g=S.gifts.find(x=>x.id===v);if(!g)return;closeSheet();
    if((await q(sb.from('gifts').delete().eq('id',v))).ok){refresh();toast('Gift deleted',async()=>{if((await q(sb.from('gifts').insert(g))).ok)refresh()})}}
  else if(a==='rmperson'||a==='leave'){
    if(!arm(b))return;
    if(a==='rmperson'){if((await q(sb.from('people').delete().eq('id',v))).ok){b.closest('.prow').remove();refresh()}}
    else{closeSheet();if((await q(sb.from('members').delete().eq('family_id',S.famId).eq('user_id',uid))).ok){try{localStorage.removeItem('uw-fam')}catch(_){}await loadFamilies(null);toast('You left the family')}}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderGiftList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(f)),k=f.dataset.form,v=f.dataset.v;
  const btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;
  try{
    if(k==='auth'){
      const email=(d.email||'').trim(),password=d.password||'';
      if(S.authMode==='in'){await q(sb.auth.signInWithPassword({email,password}))}
      else{const r=await q(sb.auth.signUp({email,password,options:{emailRedirectTo:APP_LINK}}));
        if(r.ok&&!r.data.session)toast('Check your email to confirm your account, then sign in.')}
    }
    else if(k==='wish'){
      const title=(d.title||'').trim();if(!title)return;
      let link=(d.link||'').trim();if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
      const data={title,link,price:Math.max(0,Math.round((parseFloat(d.price)||0)*100)/100),notes:(d.notes||'').trim()};
      const r=v?await q(sb.from('wishes').update(data).eq('id',v)):await q(sb.from('wishes').insert({...data,family_id:S.famId,person:f.dataset.p}));
      if(r.ok){closeSheet();toast(v?'Wish updated':'Added to the wish list');refresh()}
    }
    else if(k==='create')await createFamily(d);
    else if(k==='join')await join(d.code);
    else if(k==='addperson'||k==='addme'){
      const name=(d.name||'').trim();if(!name)return;
      if(k==='addme'&&me())return;
      if((await q(sb.from('people').insert({family_id:S.famId,name,claimed_by:k==='addme'?uid:null}))).ok){f.reset();refresh()}
    }
    else if(k==='budget'){if((await q(sb.from('people').update({budget:Math.max(0,parseFloat(d.budget)||0)}).eq('id',v))).ok){toast('Budget saved');refresh()}}
    else if(k==='mylimit'){const amount=Math.max(0,parseFloat(d.lim)||0);
      if((await q(sb.from('limits').upsert({family_id:S.famId,user_id:uid,amount},{onConflict:'family_id,user_id'}))).ok){S.myLimit=amount;toast('Limit saved');render()}}
    else if(k==='famedit'){const name=(d.name||'').trim();if(!name)return;
      if((await q(sb.from('families').update({name,occasion:(d.occasion||'').trim()}).eq('id',S.famId))).ok){closeSheet();toast('Saved');await loadFamilies(S.famId);refresh()}}
    else if(k==='gift'){
      const title=(d.title||'').trim();if(!title)return;
      if(mine().includes(d.recipient)){toast("You can't log a gift for yourself.");return}
      const data={title,recipient:d.recipient,...(d.wish_id?{wish_id:d.wish_id}:{}),buyer:d.buyer||null,price:Math.max(0,Math.round((parseFloat(d.price)||0)*100)/100),status:d.status,store:(d.store||'').trim(),notes:(d.notes||'').trim(),updated_at:new Date().toISOString()};
      const r=v?await q(sb.from('gifts').update(data).eq('id',v)):await q(sb.from('gifts').insert({...data,family_id:S.famId}));
      if(r.ok){closeSheet();toast(v?'Gift updated':'Gift logged for '+pname(d.recipient));refresh()}
    }
  }finally{if(btn&&btn.isConnected)btn.disabled=false}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&uid&&S.famId)soon()});

// ---------- Start ----------
if(!configured||!window.supabase){S.loading=false;render()}
else{
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY);
  const timer=setTimeout(()=>{if(S.loading){S.err='Still connecting… check your connection.';render()}},10000);
  sb.auth.onAuthStateChange((ev,session)=>{
    const id=session&&session.user?session.user.id:null;
    setTimeout(async()=>{
      clearTimeout(timer);
      S.email=session&&session.user?session.user.email||'':'';
      if(id===uid&&!S.loading)return;
      uid=id;S.loading=false;S.err='';
      if(uid){S.loading=true;render();await loadFamilies(null);S.loading=false;render()}
      else{if(chan){sb.removeChannel(chan);chan=null}Object.assign(S,{families:[],famId:null,fam:null,famLoaded:false,people:[],gifts:[],wishes:[],person:null,tab:'people'});render()}
    },0);
  });
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
}
</script>
</body></html>
